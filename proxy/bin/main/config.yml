# MC2P proxy configuration (Section 5.2 of the spec).
# Named tokens: each key maps to a name and a role. Secrets come from
# env:VAR | file:path | plaintext (never plaintext in production).
# The legacy role->source map (reader/ops/admin) is still accepted.
serverId: proxy-01

mcp:
  bind: 0.0.0.0
  port: 8443
  endpoint: /mcp
  tls:
    mode: selfsigned          # selfsigned | keystore | none-behind-proxy | none
    keystore: keystore.p12
    password-env: MC2P_KEYSTORE_PW
  body-limit-bytes: 65536

auth:
  # Named tokens: each key maps to a name and a role. Secrets come from
  # env:VAR | file:path | plaintext (warned). Run /mc2p setup to auto-generate
  # missing tokens, and /mc2p token create <name> <role> to mint new keys.
  tokens:
    - name: reader
      role: reader
      token: env:MC2P_TOKEN_READER
    - name: ops
      role: ops
      token: env:MC2P_TOKEN_OPS
    - name: admin
      role: admin
      token: env:MC2P_TOKEN_ADMIN
  ip-allowlist: []
  rate-limit:
    tokens-per-second: 5
    burst: 20
  # How long a client stays listed in /mc2p activity after its last request (minutes).
  activity-window-minutes: 5

# Optional Velocity server-name -> serverId map. Auto-discovered backends use the
# Velocity server name as the serverId when not listed here.
servers: {}

rpc:
  secret-env: MC2P_PROXY_SECRET
  channel: mc2p:rpc
  timeout-ms: 5000
  max-chunks: 8

audit:
  file: logs/mcp-proxy-audit.log
  max-mb: 50
  max-files: 5