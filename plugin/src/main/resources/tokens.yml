# MC2P token store reference. The plugin creates this file in the plugin data folder on
# first run and manages it via /mc2p token. Format: a YAML list of tokens.
#
#   name:   unique token name (letters, digits, -, _; max 40)
#   token:  secret source spec (see below)
#   restrictions:  optional per-token access control; narrows the global/server
#                  restrictions (most-restrictive wins). Same layout as
#                  global-restrictions in config.yml.
#   disabled: true|false   (a disabled token stops authenticating but stays listed)
#
# Secret source spec for "token":
#   env:VAR        - read the secret from environment variable VAR
#   file:path      - read the secret from a file (relative paths are resolved against
#                    the plugin data folder)
#   plaintext      - literal value, must be a long random secret (kept in memory only)
#   sha256:<hex>   - persisted hash of a token generated by /mc2p token create
#
# Only sha256: hashes are ever written to this file for tokens the plugin generates;
# plaintext secrets from env/file sources are hashed at load time and never persisted.
#
# Example:
# - name: julian
#   token: env:MC2P_TOKEN_JULIAN
#   restrictions:
#     enabled: true
#     tools:
#       enabled: true
#       allowlist:
#         - block_get
#         - block_set
#         - entity_list
#         - entity_get
#         - entity_set
#         - region_get
#         - player_stats
#       denylist: []
#     commands:
#       enabled: true
#       allowlist:
#         - gamemode
#         - tp
#         - teleport
#         - weather
#         - time
#         - effect
#         - clear
#       denylist:
#         - stop
#         - restart
#         - save-off
#         - save-all
#         - kick-all
#         - op
#     worlds:
#       enabled: true
#       allowlist:
#         - world
#         - world_nether
#         - world_the_end
#       denylist: []