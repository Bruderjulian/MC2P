# MC2P standalone configuration (backend plugin).
#
# This file is used when this server serves the MCP endpoint directly (standalone
# topology). Switch to backend mode with: /mc2p mode backend
# Tokens live in tokens.yml (created on first run; /mc2p token create <name>).
#
# Access control: the sections below are "global-restrictions" and apply to every
# token. Per-token restrictions in tokens.yml narrow them further (most-restrictive
# wins). Deny always wins; empty allowlists allow everything.

mcp:
  # The proxy/proxy-IP is the "known host"; with tls.mode=selfsigned agents must trust the
  # generated CA (see /mc2p and docs/SECURITY.md).
  bind: 0.0.0.0
  port: 8443
  endpoint: /mcp
  # Maximum accepted HTTP body size (bytes). Prevents oversized requests.
  body-limit-bytes: 65536
  tls:
    # selfsigned (default, generates a PKCS12 keystore on first run)
    # keystore (bring your own keystore; set MC2P_KEYSTORE_PW)
    # none-behind-proxy (host panel terminates TLS in front of this port)
    # none (PLAINTEXT - only for local testing)
    mode: selfsigned
    keystore: keystore.p12
    password-env: MC2P_KEYSTORE_PW

proxy:
  # Env var holding the shared secret used by the proxy's RPC handshake (backend mode).
  secret: MC2P_PROXY_SECRET
  # Maximum wait for a backend round trip (ms).
  timeout-ms: 5000

auth:
  # Optional: only allow these CIDR blocks to reach the MCP endpoint (empty = allow all).
  ip-allowlist: []
  rate-limit:
    tokens-per-second: 5
    capacity: 20
  # How long a client stays listed in /mc2p activity after its last request (minutes).
  activity-window-minutes: 5

restart:
  # auto | spigot-restart | host-restart | disabled
  strategy: auto

audit:
  # JSON-lines audit log, append-only, fail-closed for destructive actions.
  file: logs/mcp-audit.log
  max-mb: 50
  max-files: 5


limits:
  # Maximum number of concurrent requests to the MCP endpoint (default: 12).
  max-concurrent-requests: 12
  # Coordinate clamp for block/entity tools (world border default).
  max-coordinate: 30000000
  # Maximum blocks returned by region_get. (default: 32 * 32 * 32 = 32768)
  max-region-blocks: 32768
  # Maximum entities returned by entity_list.
  max-entity-limit: 128
  # Maximum command string length for command_execute. -1 for gamerule default
  max-command-length: -1


global-restrictions:
  enabled: true
  tools:
    enabled: true
    allowlist:
      - block_get
      - block_set
      - entity_list
      - entity_get
      - entity_set
      - region_get
      - player_stats
    denylist: []
  commands:
    enabled: true
    allowlist:
      - gamemode
      - tp
      - teleport
      - weather
      - time
      - effect
      - clear
    denylist:
      - stop
      - restart
      - save-off
      - save-all
      - kick-all
      - op
  worlds:
    enabled: true
    allowlist:
      - world
      - world_nether
      - world_the_end
    denylist: []
