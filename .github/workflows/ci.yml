name: Build & Test

permissions:
  contents: read
  actions: read
  checks: write

on:
  push:
    paths:
      - "plugin-*/**"
      - "proxy-*/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - main
    paths:
      - "zenith-*/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

jobs:
  build-and-test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Cache Gradle
        uses: actions/cache@v5 # https://github.com/actions/cache/releases
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build -x test -x spotlessCheck -x checkstyleMain -x checkstyleTest --console=plain


      - name: Test the artifact
        run: |
          ./gradlew test --console=plain
          test -f plugin/build/libs/mc2p-plugin.jar
          test -f proxy/build/libs/mc2p-proxy.jar
          unzip -l plugin/build/libs/mc2p-plugin.jar | grep -q "plugin.yml"
          unzip -l plugin/build/libs/mc2p-plugin.jar | grep -q "dev/mc2p/lib/mcp/"
          unzip -l proxy/build/libs/mc2p-proxy.jar | grep -q "velocity-plugin.json"

      - name: Code quality
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mc2p-dist
          overwrite: true
          path: |
            plugin/build/libs/mc2p-plugin.jar
            proxy/build/libs/mc2p-proxy.jar
          if-no-files-found: error

