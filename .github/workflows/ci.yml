name: Build & Test

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build
        run: ./gradlew build -x test -x spotlessCheck -x checkstyleMain -x checkstyleTest --console=plain

      - name: Test the artifact
        run: |
          ./gradlew test --console=plain
          test -f plugin/build/libs/mc2p-plugin.jar
          test -f proxy/build/libs/mc2p-proxy.jar
          unzip -l plugin/build/libs/mc2p-plugin.jar | grep -q "plugin.yml"
          unzip -l plugin/build/libs/mc2p-plugin.jar | grep -q "dev/mc2p/lib/mcp/"
          unzip -l proxy/build/libs/mc2p-proxy.jar | grep -q "velocity-plugin.json"

      - name: Code quality
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc2p-dist
          path: |
            plugin/build/libs/mc2p-plugin.jar
            proxy/build/libs/mc2p-proxy.jar
          if-no-files-found: error
